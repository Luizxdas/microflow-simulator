apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana
          ports:
            - containerPort: 3000

          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"

          volumeMounts:
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards

            - name: providers
              mountPath: /etc/grafana/provisioning/dashboards

            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources

      volumes:
        - name: dashboards
          projected:
            sources:
              - configMap:
                  name: grafana-dashboard-jvm
              - configMap:
                  name: grafana-dashboard-rabbitmq

        - name: providers
          configMap:
            name: grafana-dashboard-providers

        - name: datasources
          configMap:
            name: grafana-datasources
