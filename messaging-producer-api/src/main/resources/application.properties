spring.application.name=messaging-producer-api

spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=2000ms
spring.rabbitmq.template.retry.max-attempts=5
spring.rabbitmq.template.retry.multiplier=1.5

spring.rabbitmq.connection-timeout=5000ms

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always