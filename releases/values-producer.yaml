app:
  image: "localhost:5001/producer:latest"

service:
  name: producer
  ports:
    - name: http
      port: 8080
      targetPort: 8080

metrics:
  enabled: true
  serviceMonitor:
    labels:
      monitoring: "true"
    interval: 30s
    path: /actuator/prometheus
    portName: http

env:
  - name: SPRING_RABBITMQ_HOST
    value: "rabbitmq-server"
  - name: SPRING_RABBITMQ_PORT
    value: "5672"
  - name: SPRING_RABBITMQ_USERNAME
    valueFrom:
      secretKeyRef:
        name: rabbitmq-server-default-user
        key: username
  - name: SPRING_RABBITMQ_PASSWORD
    valueFrom:
      secretKeyRef:
        name: rabbitmq-server-default-user
        key: password